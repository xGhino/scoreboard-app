<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATP Pickle Ground - OBS Overlay</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --border: #15283c;
      --pink-2: #ff4d8f;
      --radius: 14px;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      background: transparent;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      padding: 16px;
    }

    .preview-box {
      width: 100%;
      max-width: 1400px;
      padding: 0;
      margin: 0 auto;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .team-card {
      display: grid;
      grid-template-columns: 96px 1fr auto 64px;
      align-items: center;
      gap: 16px;
      min-height: 100px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 10px;
      padding: 14px 18px;
      overflow: hidden;
    }

    .team-card + .team-card {
      margin-top: 10px;
    }

    .preview-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 2px solid #ffffff;
      padding-right: 14px;
      min-height: 68px;
      width: 96px;
      position: relative;
      overflow: hidden;
    }

    .preview-logo .fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .preview-logo .ap {
      color: var(--pink-2);
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .preview-logo .sub {
      color: var(--pink-2);
      font-size: 9px;
      letter-spacing: 2px;
      margin-top: 4px;
      line-height: 1.3;
      text-align: center;
    }

    .team-logo-img {
      display: none;
      max-width: 100%;
      max-height: 70px;
      object-fit: contain;
    }

    .team-main-name {
      font-size: 25px;
      font-weight: 800;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .team-sub-name {
      font-size: 16px;
      margin-top: 8px;
    }

    .serve-indicators {
      display: flex;
      gap: 18px;
      padding: 0 10px;
      min-width: 68px;
      justify-content: center;
      min-height: 24px;
      align-items: center;
    }

    .serve-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-block;
    }

    .preview-score {
      font-size: 60px;
      font-weight: 800;
      line-height: 1;
      text-align: right;
      min-width: 54px;
    }

    .bottom-match-info {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      padding: 12px 8px 0;
      font-size: 14px;
      color: #e6eefc;
      letter-spacing: 1.8px;
      flex-wrap: wrap;
    }

    .bottom-match-info .separator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--pink-2);
    }

    @media (max-width: 1100px) {
      .team-card {
        grid-template-columns: 96px 1fr;
      }

      .serve-indicators,
      .preview-score {
        grid-column: 2;
      }
    }
  </style>
</head>
<body>
  <section class="preview-box" id="livePreviewBox">
    <div class="team-card" id="team1Card">
      <div class="preview-logo" id="previewLogoWrap1">
        <div id="logo1Fallback" class="fallback">
          <div class="ap">ATP</div>
          <div class="sub">PICKLE<br>GROUND</div>
        </div>
        <img id="logo1Image" class="team-logo-img" alt="Team 1 Logo">
      </div>

      <div>
        <div class="team-main-name" id="previewTeam1Main">GABRIEL / CARLO</div>
        <div class="team-sub-name" id="previewTeam1Sub">Gabriel Joseph / Carlo Antonio</div>
      </div>

      <div class="serve-indicators" id="serveIndicatorTeam1"></div>

      <div class="preview-score" id="preview-score1">11</div>
    </div>

    <div class="team-card" id="team2Card">
      <div class="preview-logo" id="previewLogoWrap2">
        <div id="logo2Fallback" class="fallback">
          <div class="ap">ATP</div>
          <div class="sub">PICKLE<br>GROUND</div>
        </div>
        <img id="logo2Image" class="team-logo-img" alt="Team 2 Logo">
      </div>

      <div>
        <div class="team-main-name" id="previewTeam2Main">JOHN / MARK</div>
        <div class="team-sub-name" id="previewTeam2Sub">John Smith / Mark Davis</div>
      </div>

      <div class="serve-indicators" id="serveIndicatorTeam2"></div>

      <div class="preview-score" id="preview-score2">8</div>
    </div>

    <div class="bottom-match-info" id="bottomMatchInfo"></div>
  </section>

  <script>
    const fallbackState = {
      team1: {
        name: "GABRIEL / CARLO",
        players: "Gabriel Joseph / Carlo Antonio",
        score: 11,
        logo: "",
        bg: "#E5AFB6",
        font: "#000000",
        line: "#000000"
      },
      team2: {
        name: "JOHN / MARK",
        players: "John Smith / Mark Davis",
        score: 8,
        logo: "",
        bg: "#595963",
        font: "#FFFFFF",
        line: "#FFFFFF"
      },
      match: {
        court: "COURT 1",
        division: "MEN'S DOUBLES",
        bracket: "GROUP A"
      },
      settings: {
        width: 1400,
        opacity: 85,
        logoSize: 80
      },
      service: 2
    };

    function normalizeHex(value, fallback = "#000000") {
      let val = (value || "").trim();
      if (!val.startsWith("#")) val = "#" + val;
      if (/^#[0-9A-Fa-f]{6}$/.test(val)) return val.toUpperCase();
      return fallback.toUpperCase();
    }

    function hexToRgba(hex, opacityPercent) {
      let clean = (hex || "").replace("#", "").trim();
      if (clean.length === 3) clean = clean.split("").map(c => c + c).join("");
      if (clean.length !== 6) return "rgba(12,18,27,0.85)";
      const r = parseInt(clean.substring(0, 2), 16);
      const g = parseInt(clean.substring(2, 4), 16);
      const b = parseInt(clean.substring(4, 6), 16);
      const a = Math.max(0, Math.min(100, Number(opacityPercent))) / 100;
      return `rgba(${r}, ${g}, ${b}, ${a})`;
    }

    function mergeState(data = {}) {
      return {
        team1: { ...fallbackState.team1, ...(data.team1 || {}) },
        team2: { ...fallbackState.team2, ...(data.team2 || {}) },
        match: { ...fallbackState.match, ...(data.match || {}) },
        settings: { ...fallbackState.settings, ...(data.settings || {}) },
        service: data.service ?? fallbackState.service
      };
    }

    function applyTeam(teamNumber, team, opacity) {
      const card = document.getElementById(`team${teamNumber}Card`);
      const logoWrap = document.getElementById(`previewLogoWrap${teamNumber}`);
      const main = document.getElementById(`previewTeam${teamNumber}Main`);
      const sub = document.getElementById(`previewTeam${teamNumber}Sub`);
      const score = document.getElementById(`preview-score${teamNumber}`);
      const img = document.getElementById(`logo${teamNumber}Image`);
      const fallback = document.getElementById(`logo${teamNumber}Fallback`);

      const bgColor = normalizeHex(team.bg, fallbackState[`team${teamNumber}`].bg);
      const fontColor = normalizeHex(team.font, fallbackState[`team${teamNumber}`].font);
      const lineColor = normalizeHex(team.line, fallbackState[`team${teamNumber}`].line);
      const logo = String(team.logo || "").trim();

      card.style.background = `linear-gradient(90deg, ${hexToRgba(bgColor, opacity)}, ${hexToRgba(bgColor, opacity)})`;
      card.style.borderColor = lineColor;
      logoWrap.style.borderRightColor = lineColor;

      main.textContent = String(team.name || "").trim() || `TEAM ${teamNumber}`;
      sub.textContent = String(team.players || "").trim();
      main.style.color = fontColor;
      sub.style.color = fontColor;
      score.textContent = Number(team.score) || 0;
      score.style.color = fontColor;

      img.src = logo;
      img.style.display = logo ? "block" : "none";
      fallback.style.display = logo ? "none" : "flex";
    }

    function applyLogoSize(size) {
      const value = Math.max(20, Math.min(200, Number(size) || 80));

      document.querySelectorAll(".preview-logo").forEach(el => {
        el.style.width = value + "px";
      });

      document.querySelectorAll(".team-logo-img").forEach(img => {
        img.style.maxWidth = Math.max(20, value - 10) + "px";
        img.style.maxHeight = Math.max(20, value - 10) + "px";
      });

      document.querySelectorAll(".preview-logo .ap").forEach(el => {
        el.style.fontSize = Math.max(18, value * 0.35) + "px";
      });

      document.querySelectorAll(".preview-logo .sub").forEach(el => {
        el.style.fontSize = Math.max(7, value * 0.11) + "px";
      });
    }

    function createServeDot(color) {
      const dot = document.createElement("div");
      dot.className = "serve-dot";
      dot.style.background = color;
      return dot;
    }

    function renderPreviewServe(teamNumber, count, color) {
      const box = document.getElementById(`serveIndicatorTeam${teamNumber}`);
      box.innerHTML = "";
      for (let i = 0; i < count; i++) {
        box.appendChild(createServeDot(color));
      }
    }

    function updateServiceVisuals(state) {
      const serviceState = Number(state.service) || 0;
      const team1Line = normalizeHex(state.team1.line, fallbackState.team1.line);
      const team2Line = normalizeHex(state.team2.line, fallbackState.team2.line);

      if (serviceState === 1) {
        renderPreviewServe(1, 1, team1Line);
        renderPreviewServe(2, 0, team2Line);
      } else if (serviceState === 2) {
        renderPreviewServe(1, 2, team1Line);
        renderPreviewServe(2, 0, team2Line);
      } else if (serviceState === 4) {
        renderPreviewServe(1, 0, team1Line);
        renderPreviewServe(2, 1, team2Line);
      } else if (serviceState === 5) {
        renderPreviewServe(1, 0, team1Line);
        renderPreviewServe(2, 2, team2Line);
      } else {
        renderPreviewServe(1, 0, team1Line);
        renderPreviewServe(2, 0, team2Line);
      }
    }

    function updateMatchInfoDisplay(match) {
      const wrap = document.getElementById("bottomMatchInfo");
      const items = [match.court, match.division, match.bracket]
        .map(item => String(item || "").trim())
        .filter(Boolean);

      wrap.innerHTML = "";
      items.forEach((item, index) => {
        const span = document.createElement("span");
        span.textContent = item;
        wrap.appendChild(span);

        if (index < items.length - 1) {
          const sep = document.createElement("span");
          sep.className = "separator";
          wrap.appendChild(sep);
        }
      });
    }

    function applyState(data) {
      const state = mergeState(data);
      const width = Math.max(600, Math.min(2500, Number(state.settings.width) || 1400));
      const opacity = Math.max(10, Math.min(100, Number(state.settings.opacity) || 85));

      document.getElementById("livePreviewBox").style.maxWidth = width + "px";
      applyTeam(1, state.team1, opacity);
      applyTeam(2, state.team2, opacity);
      applyLogoSize(state.settings.logoSize);
      updateServiceVisuals(state);
      updateMatchInfoDisplay(state.match);
    }

    // --- Cross-page sync (client-side only, no backend/server needed) ---
    // Reads the same localStorage key that admin.html writes to, on the
    // same origin. Updates arrive instantly via BroadcastChannel, with a
    // storage-event listener and a light polling fallback as safety nets
    // in case a browser doesn't fire one of those events reliably.
    const STATE_STORAGE_KEY = "apPickleGround_scoreboardState";
    const stateChannel = ("BroadcastChannel" in window)
      ? new BroadcastChannel("ap-pickle-scoreboard")
      : null;

    let lastRawState = null;

    function readStateFromStorage() {
      try {
        const raw = localStorage.getItem(STATE_STORAGE_KEY);
        if (!raw) return null;
        if (raw === lastRawState) return undefined; // unchanged, skip re-render
        lastRawState = raw;
        return JSON.parse(raw);
      } catch (error) {
        return null;
      }
    }

    function refreshFromStorage() {
      const data = readStateFromStorage();
      if (data === undefined) return; // no change
      applyState(data || fallbackState);
    }

    applyState(fallbackState);
    refreshFromStorage();

    if (stateChannel) {
      stateChannel.onmessage = (event) => {
        lastRawState = JSON.stringify(event.data);
        applyState(event.data || fallbackState);
      };
    }

    // Fires when admin.html and overlay.html are in different tabs/windows
    // of the same browser (BroadcastChannel already covers same-tab-group
    // cases, this is a same-origin cross-window fallback).
    window.addEventListener("storage", (event) => {
      if (event.key === STATE_STORAGE_KEY) refreshFromStorage();
    });

    // Cheap safety-net poll in case an event is ever missed.
    setInterval(refreshFromStorage, 500);

    // --- Remote sync (works across different browsers/devices) ---
    // Real-time listener on the same Firebase Realtime Database board that
    // admin.html writes to. The board id must be in this page's URL as
    // "?board=<id>" — that link is generated for you by admin.html once it
    // creates or connects to a board. This is what lets the overlay update
    // even when it's opened in a totally different browser than the control
    // panel (e.g. OBS's Browser Source vs. your regular Chrome on another PC).
    //
    // >>> REQUIRED: same Firebase project config as admin.html <<<
    const firebaseConfig = {
      apiKey: "AIzaSyCxyVuKSJG1Jx61EtzuhfVkJ7qXLXooLQs",
      authDomain: "pickleball-scoresheet-gjgg.firebaseapp.com",
      databaseURL: "https://pickleball-scoresheet-gjgg-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "pickleball-scoresheet-gjgg"
    };

    const boardId = new URLSearchParams(location.search).get("board");

    if (!boardId) {
      console.warn(
        "No ?board= id in this URL, so this overlay can only sync with a " +
        "control panel running in the exact same browser. Open the overlay " +
        "link shown in admin.html instead for cross-browser sync."
      );
    } else {
      firebase.initializeApp(firebaseConfig);
      const fbAuth = firebase.auth();
      const fbDb = firebase.database();

      fbAuth.onAuthStateChanged((user) => {
        if (!user) return;
        fbDb.ref("boards/" + boardId).on("value", (snapshot) => {
          const data = snapshot.val();
          lastRawState = JSON.stringify(data); // keep the local-sync dedupe in step too
          applyState(data || fallbackState);
        }, (error) => {
          console.error("Firebase read failed (check database rules):", error);
        });
      });

      fbAuth.signInAnonymously().catch((err) => {
        console.error("Firebase sign-in failed (check firebaseConfig / Anonymous auth is enabled):", err);
      });
    }
  </script>
</body>
</html>
